name: Visual Smoke Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/visual-smoke-audit.yml"
      - "apps/web/scripts/visual-acceptance-audit.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: simpleway_drawing
          POSTGRES_USER: simpleway
          POSTGRES_PASSWORD: simpleway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simpleway -d simpleway_drawing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://simpleway:simpleway@127.0.0.1:5432/simpleway_drawing
      AUTH_SECRET: visual-audit-auth-secret-at-least-32-characters
      ALPHA_OPS_TOKEN: visual-audit-alpha-ops-token-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      STORAGE_BUCKET: simpleway-drawing-visual-audit
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: simpleway
      STORAGE_SECRET_KEY: simpleway-storage-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Start S3-compatible MinIO service
        shell: bash
        run: |
          docker run -d --name swd-visual-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=simpleway \
            -e MINIO_ROOT_PASSWORD=simpleway-storage-secret \
            minio/minio:latest server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MINIO_READY=PASS"
              exit 0
            fi
            sleep 1
          done
          docker logs swd-visual-minio || true
          exit 1

      - name: Prepare private storage bucket
        env:
          STORAGE_KEEP_BUCKET: "1"
        run: pnpm --filter @swd/storage verify:ci

      - name: Build production application
        run: pnpm build

      - name: Locate Chrome
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium not found on runner" >&2
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Normalize authored visual marker and runtime seed contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/scripts/visual-acceptance-audit.mjs")
          source = path.read_text(encoding="utf-8")

          marker_old = 'assert.match(svg, /<title id="title">HNK Form Check<\\/title>/);'
          marker_new = 'assert.match(svg, /<title id="title">HNK Form Check[^<]*<\\/title>/);'
          if marker_old not in source:
              raise SystemExit("expected V1.41 marker assertion not found")
          source = source.replace(marker_old, marker_new, 1)

          baseline_old = '  const baseline = await createArtwork(cookieHeader, { bytes: pngA, title: "Drawing Zero", type: "BASELINE", notes: "Visual acceptance baseline" });'
          baseline_new = '''  const baselineFileAssetId = await uploadPrivate(cookieHeader, pngA);
          const baselineResponse = await fetch(`${baseUrl}/api/drawing-zero`, {
            method: "POST",
            headers: { cookie: cookieHeader, "content-type": "application/json" },
            body: JSON.stringify({ fileAssetId: baselineFileAssetId, source: "UPLOAD" }),
          });
          await assertHttp(baselineResponse, 201, "create Drawing Zero");
          const baselinePayload = await baselineResponse.json();
          const baseline = { id: baselinePayload.id ?? baselinePayload.baseline?.id ?? "drawing-zero" };'''
          if baseline_old not in source:
              raise SystemExit("expected visual audit baseline seed not found")
          source = source.replace(baseline_old, baseline_new, 1)

          cookie_old = '      await cdp.send("Network.setCookie", { name: guest.cookieName, value: guest.cookieValue, url: baseUrl });'
          cookie_new = '''      const cookieResult = await cdp.send("Network.setCookie", {
        name: guest.cookieName,
        value: guest.cookieValue,
        url: baseUrl,
        path: "/",
        secure: true,
        httpOnly: true,
        sameSite: "Lax",
      });
      assert.notEqual(cookieResult.success, false, "Chrome rejected the production session cookie");'''
          if cookie_old not in source:
              raise SystemExit("expected visual audit cookie injection not found")
          source = source.replace(cookie_old, cookie_new, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Capture desktop and mobile visual acceptance evidence
        env:
          VISUAL_AUDIT_BASE_URL: http://127.0.0.1:3100
          VISUAL_AUDIT_EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          VISUAL_AUDIT_OUTPUT: artifacts/visual-smoke-v1-42
        shell: bash
        run: |
          pnpm --filter @swd/web exec next start -p 3100 > /tmp/simpleway-drawing-visual.log 2>&1 &
          SERVER_PID=$!
          trap 'STATUS=$?; if [ $STATUS -ne 0 ]; then cat /tmp/simpleway-drawing-visual.log || true; fi; kill $SERVER_PID 2>/dev/null || true; exit $STATUS' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then
              echo "VISUAL_APP_READY=PASS"
              break
            fi
            if [ "$attempt" = "40" ]; then
              cat /tmp/simpleway-drawing-visual.log || true
              exit 1
            fi
            sleep 1
          done
          node apps/web/scripts/visual-acceptance-audit.mjs

      - name: Upload visual acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-v1-42
          path: artifacts/visual-smoke-v1-42
          if-no-files-found: error
          retention-days: 7
