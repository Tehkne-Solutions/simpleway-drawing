name: Visual Smoke Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/visual-smoke-audit.yml"
      - "apps/web/app/**"
      - "apps/web/game/**"
      - "apps/web/scripts/visual-acceptance-audit.mjs"
      - "content/**"
      - "packages/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: simpleway_drawing
          POSTGRES_USER: simpleway
          POSTGRES_PASSWORD: simpleway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simpleway -d simpleway_drawing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://simpleway:simpleway@127.0.0.1:5432/simpleway_drawing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply versioned database migrations
        run: pnpm db:migrate

      - name: Start S3-compatible MinIO service
        run: |
          docker run -d --name swd-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=simpleway \
            -e MINIO_ROOT_PASSWORD=simpleway-storage-secret \
            minio/minio:latest server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MINIO_READY=PASS"
              exit 0
            fi
            sleep 1
          done
          docker logs swd-minio || true
          exit 1

      - name: Prepare persistent visual-audit bucket
        env:
          STORAGE_ENDPOINT: http://127.0.0.1:9000
          STORAGE_BUCKET: simpleway-drawing-visual-audit
          STORAGE_REGION: us-east-1
          STORAGE_ACCESS_KEY: simpleway
          STORAGE_SECRET_KEY: simpleway-storage-secret
          STORAGE_KEEP_BUCKET: "1"
        run: pnpm --filter @swd/storage verify:ci

      - name: Build production application
        run: pnpm build

      - name: Locate Chrome
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium not found on runner" >&2
            exit 1
          fi
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Capture desktop and mobile visual acceptance evidence
        env:
          NODE_ENV: production
          AUTH_SECRET: visual-audit-secret-at-least-32-characters-long
          ALPHA_OPS_TOKEN: visual-audit-alpha-ops-token-at-least-32-characters-long
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          STORAGE_ENDPOINT: http://127.0.0.1:9000
          STORAGE_BUCKET: simpleway-drawing-visual-audit
          STORAGE_REGION: us-east-1
          STORAGE_ACCESS_KEY: simpleway
          STORAGE_SECRET_KEY: simpleway-storage-secret
          VISUAL_AUDIT_BASE_URL: http://127.0.0.1:3100
          VISUAL_AUDIT_EXPECTED_BASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VISUAL_AUDIT_OUTPUT: artifacts/visual-smoke-v1-42
        shell: bash
        run: |
          pnpm --filter @swd/web exec next start -p 3100 > /tmp/simpleway-drawing-visual-audit.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            STATUS=$?
            trap - EXIT
            if [ "$STATUS" -ne 0 ]; then
              cat /tmp/simpleway-drawing-visual-audit.log || true
              docker logs swd-minio || true
            fi
            kill "$SERVER_PID" 2>/dev/null || true
            docker rm -f swd-minio >/dev/null 2>&1 || true
            exit "$STATUS"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/api/ready >/dev/null; then
              echo "VISUAL_AUDIT_RUNTIME_READY=PASS"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Local visual-audit runtime did not become ready" >&2
              curl --silent --show-error http://127.0.0.1:3100/api/ready || true
              exit 1
            fi
            sleep 1
          done

          node apps/web/scripts/visual-acceptance-audit.mjs

      - name: Upload visual acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-v1-42
          path: artifacts/visual-smoke-v1-42
          if-no-files-found: error
          retention-days: 7
