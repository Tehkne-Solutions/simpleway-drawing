name: Production Launch Gate

on:
  workflow_dispatch:
    inputs:
      deploy_url:
        description: "HTTPS URL of the deployed SimpleWay Drawing release candidate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: simpleway-drawing-production-launch
  cancel-in-progress: false

jobs:
  production-launch-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_BASE_URL: ${{ inputs.deploy_url }}
    steps:
      - name: Checkout production gate
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production launch readiness
        run: node apps/web/scripts/production-launch-gate.mjs

      - name: Publish GO summary
        if: success()
        run: |
          echo "## SimpleWay Drawing · Production Launch Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`$DEPLOY_BASE_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Decision: **GO**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gate: health, database readiness, security headers, public identity, privacy, Ops guard, secure session, learning runtime, diagnostics, privacy export and CSRF" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tehkné Solutions" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish NO-GO summary
        if: failure()
        run: |
          echo "## SimpleWay Drawing · Production Launch Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`$DEPLOY_BASE_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Decision: **NO-GO**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Action: correct the failing production contract before inviting testers." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tehkné Solutions" >> "$GITHUB_STEP_SUMMARY"
