name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm content:validate
      - run: pnpm test
      - name: Deployment environment contract
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://closed_alpha:closed_alpha@db.example.internal:5432/simpleway_drawing
          AUTH_SECRET: ci-deploy-contract-secret-at-least-32-characters
          NEXT_PUBLIC_APP_URL: https://simpleway-drawing.example.com
          STORAGE_BUCKET: simpleway-drawing-ci
          STORAGE_REGION: auto
          STORAGE_ACCESS_KEY: ci-access-key
          STORAGE_SECRET_KEY: ci-secret-key
        run: pnpm deploy:check
      - run: pnpm build
      - name: Production HTTP smoke
        env:
          E2E_BASE_URL: http://127.0.0.1:3100
          AUTH_SECRET: ci-smoke-secret-at-least-32-characters-long
        run: |
          pnpm --filter @swd/web exec next start -p 3100 > /tmp/simpleway-drawing-next.log 2>&1 &
          SERVER_PID=$!
          trap 'STATUS=$?; if [ $STATUS -ne 0 ]; then cat /tmp/simpleway-drawing-next.log || true; fi; kill $SERVER_PID 2>/dev/null || true; exit $STATUS' EXIT
          pnpm --filter @swd/web e2e:smoke
