name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: simpleway_drawing
          POSTGRES_USER: simpleway
          POSTGRES_PASSWORD: simpleway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simpleway -d simpleway_drawing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://simpleway:simpleway@127.0.0.1:5432/simpleway_drawing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm content:validate
      - run: pnpm test
      - name: Generate diagnostic migration from current schema
        run: pnpm db:generate
      - name: Verify frozen baseline has no schema drift
        run: pnpm --filter @swd/database verify:migration-baseline
      - name: Publish generated migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-migration
          path: packages/database/drizzle
          if-no-files-found: error
          retention-days: 7
      - name: Apply versioned migrations to PostgreSQL service
        run: pnpm db:migrate
      - name: Verify migration runner is idempotent
        run: pnpm db:migrate
      - name: Verify database schema and transactional writes
        run: pnpm --filter @swd/database verify:ci
      - name: Start S3-compatible MinIO service
        run: |
          docker run -d --name swd-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=simpleway \
            -e MINIO_ROOT_PASSWORD=simpleway-storage-secret \
            minio/minio:latest server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MINIO_READY=PASS"
              exit 0
            fi
            sleep 1
          done
          docker logs swd-minio || true
          exit 1
      - name: Verify real S3-compatible storage lifecycle
        env:
          STORAGE_ENDPOINT: http://127.0.0.1:9000
          STORAGE_BUCKET: simpleway-drawing-ci
          STORAGE_REGION: us-east-1
          STORAGE_ACCESS_KEY: simpleway
          STORAGE_SECRET_KEY: simpleway-storage-secret
          STORAGE_KEEP_BUCKET: "1"
        run: pnpm --filter @swd/storage verify:ci
      - name: Deployment environment contract
        env:
          NODE_ENV: production
          AUTH_SECRET: ci-deploy-contract-secret-at-least-32-characters
          ALPHA_OPS_TOKEN: ci-alpha-ops-token-at-least-32-characters-long
          NEXT_PUBLIC_APP_URL: https://simpleway-drawing.example.com
          STORAGE_BUCKET: simpleway-drawing-ci
          STORAGE_REGION: auto
          STORAGE_ACCESS_KEY: ci-access-key
          STORAGE_SECRET_KEY: ci-secret-key
        run: pnpm deploy:check
      - run: pnpm build
      - name: Production HTTP smoke
        env:
          E2E_BASE_URL: http://127.0.0.1:3100
          AUTH_SECRET: ci-smoke-secret-at-least-32-characters-long
          ALPHA_OPS_TOKEN: ci-alpha-ops-token-at-least-32-characters-long
          STORAGE_ENDPOINT: http://127.0.0.1:9000
          STORAGE_BUCKET: simpleway-drawing-ci
          STORAGE_REGION: us-east-1
          STORAGE_ACCESS_KEY: simpleway
          STORAGE_SECRET_KEY: simpleway-storage-secret
        run: |
          pnpm --filter @swd/web exec next start -p 3100 > /tmp/simpleway-drawing-next.log 2>&1 &
          SERVER_PID=$!
          trap 'STATUS=$?; if [ $STATUS -ne 0 ]; then cat /tmp/simpleway-drawing-next.log || true; fi; kill $SERVER_PID 2>/dev/null || true; docker rm -f swd-minio 2>/dev/null || true; exit $STATUS' EXIT
          pnpm --filter @swd/web e2e:smoke
          pnpm --filter @swd/web e2e:create
          pnpm --filter @swd/web e2e:learning
          pnpm --filter @swd/web e2e:practice
          pnpm --filter @swd/web e2e:visual-labs
